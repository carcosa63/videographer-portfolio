<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EDEFEC">
<title>Портфолио</title>
<meta name="description" content="Портфолио: видео и фото">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@300;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="is-home">

<header class="top">
  <a class="brand" href="#/" id="brand"></a>
  <nav aria-label="Разделы">
    <a href="#/video" data-nav="video">Видео</a>
    <a href="#/photo" data-nav="photo">Фото</a>
  </nav>
</header>

<main id="app"></main>
<footer id="footer"></footer>

<dialog id="player" aria-label="Видео">
  <button class="close" id="closePlayer" type="button">Закрыть</button>
  <div class="frame" id="frame"></div>
</dialog>

<dialog id="viewer" aria-label="Фото">
  <button class="close" id="closeViewer" type="button">Закрыть</button>
  <button class="arrow prev" id="vPrev" type="button" aria-label="Предыдущее фото">‹</button>
  <img class="view-img" id="vImg" alt="">
  <button class="arrow next" id="vNext" type="button" aria-label="Следующее фото">›</button>
  <div class="count" id="vCount"></div>
</dialog>

<noscript><p style="padding:2rem">Для работы сайта включите JavaScript.</p></noscript>
<script src="app.js"></script>
</body>
</html>
