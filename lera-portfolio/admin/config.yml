# Замените ВАШ_ЛОГИН на логин владельца репозитория на GitHub
backend:
  name: github
  repo: carcosa63/videographer-portfolio
  branch: main

locale: ru
media_folder: lera-portfolio/images/uploads
public_folder: /images/uploads
site_url: https://portfolio-melecksa.netlify.app
display_url: https://portfolio-melecksa.netlify.app
collections:
  - name: content
    label: Сайт
    files:
      - name: works
        label: Работы
        file: lera-portfolio/content/works.json
        fields:
          - label: Работы (первая в списке показывается первой; порядок меняется перетаскиванием)
            name: works
            widget: list
            label_singular: работу
            summary: "{{fields.title}}"
            fields:
              - { label: Название, name: title, widget: string }
              - label: Категория
                name: category
                widget: select
                options: [Клипы, Свадьбы, Реклама, Путешествия, Другое]
              - { label: Год, name: year, widget: string, required: false }
              - { label: Ссылка на видео (YouTube или Vimeo), name: video_url, widget: string, required: false }
              - { label: Обложка (для YouTube можно не загружать), name: cover, widget: image, required: false }
              - { label: Описание, name: description, widget: text, required: false }
              - { label: Показать на главном экране, name: featured, widget: boolean, default: false, required: false }

      - name: site
        label: Об авторе и контакты
        file: lera-portfolio/content/site.json
        fields:
          - { label: Имя, name: name, widget: string }
          - { label: Кто вы, name: role, widget: string, default: Видеограф }
          - { label: Город, name: city, widget: string, required: false }
          - { label: О себе (абзацы разделяйте пустой строкой), name: about, widget: text, required: false }
          - { label: Фото, name: photo, widget: image, required: false }
          - { label: Email, name: email, widget: string, required: false }
          - { label: Telegram (без @), name: telegram, widget: string, required: false }
          - { label: Instagram (без @), name: instagram, widget: string, required: false }
